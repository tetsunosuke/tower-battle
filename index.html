<!DOCTYPE html>
<html>
<head>
    <title>Tower Battle</title>
    <link rel="stylesheet" href="style.css">
    <!-- MediaPipeライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>
    <h1></h1>
    <div id="ui-container">
        <div id="score">Dropped: 0</div>
        <button id="rotate-btn">回転</button>
        <button id="retry-btn">リトライ</button>
        <button id="save-image-btn" style="display: none;">画像を保存</button>
    </div>

    <div id="main-content">
        <div id="game-container">
            <div id="game-over-overlay">
                <div id="game-over-text">Game Over</div>
            </div>
        </div>
        <div id="camera-container">
            <video id="video" style="display: none;"></video>
            <canvas id="output_canvas" width="320" height="240"></canvas>
            <button id="capture-btn">この画像を使う</button>
            <div id="camera-controls">
                <select id="camera-select"></select>
                <button id="switch-camera-btn">カメラ切り替え</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
